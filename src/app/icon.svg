<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient matching bg-linear-to-br from-green-500/20 to-green-600/10 over dark background -->
    <linearGradient id="kBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2a1a"/>
      <stop offset="100%" stop-color="#05140b"/>
    </linearGradient>
    <!-- Border gradient matching border-green-500/50 and hover:border-green-500 -->
    <linearGradient id="kBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background circle badge -->
  <circle cx="256" cy="256" r="236" fill="url(#kBgGrad)" stroke="url(#kBorderGrad)" stroke-width="26"/>
  <!-- Centered bold 'K' letter matching navbar logo -->
  <text x="256" y="270" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="270">K</text>
</svg>
